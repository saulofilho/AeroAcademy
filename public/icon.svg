<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A0C10" />
    </linearGradient>
    <linearGradient id="jetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="4" />

  <!-- Radar / Horizon Compass Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="2" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Artificial Horizon Line -->
  <line x1="96" y1="256" x2="196" y2="256" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" />
  <line x1="316" y1="256" x2="416" y2="256" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" />

  <!-- Supersonic Flight Contrail Arc -->
  <path d="M 80 390 C 140 380, 210 320, 256 256" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85" filter="url(#glow)" />

  <!-- Jet Aircraft Silhouette / Flight Vector -->
  <g transform="translate(256, 256) scale(0.92) translate(-256, -256)">
    <!-- Jet Afterburner Glow -->
    <ellipse cx="256" cy="360" rx="16" ry="32" fill="#F59E0B" opacity="0.7" filter="url(#glow)" />
    
    <!-- Modern Jet Shape -->
    <path d="M 256 90 
             L 272 170 
             L 420 290 
             L 410 320 
             L 282 280 
             L 282 370 
             L 326 410 
             L 316 424 
             L 256 406 
             L 196 424 
             L 186 410 
             L 230 370 
             L 230 280 
             L 102 320 
             L 92 290 
             L 240 170 Z" 
          fill="url(#jetGrad)" 
          stroke="#7DD3FC" 
          stroke-width="3.5" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Cockpit Canopy Glass -->
    <path d="M 256 140 
             C 264 165, 264 210, 256 226 
             C 248 210, 248 165, 256 140 Z" 
          fill="#E0F2FE" 
          opacity="0.9" />

    <!-- HUD Wingtip Beacons -->
    <circle cx="415" cy="305" r="5" fill="#10B981" />
    <circle cx="97" cy="305" r="5" fill="#EF4444" />
  </g>

  <!-- Pitch Ladder Indicators -->
  <line x1="236" y1="200" x2="276" y2="200" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <line x1="244" y1="220" x2="268" y2="220" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <line x1="244" y1="292" x2="268" y2="292" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <line x1="236" y1="312" x2="276" y2="312" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
</svg>
